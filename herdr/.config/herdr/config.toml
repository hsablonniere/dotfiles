onboarding = false

[ui]
status_indicators = "symbols"
prompt_new_tab_name = false
sidebar_collapsed_mode = "hidden"
pane_outer_borders = false
pane_gaps = false
hide_tab_bar_when_single_tab = true

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[keys]
switch_tab = "alt+1..9"
split_vertical = "alt+q"
split_horizontal = "alt+shift+q"
focus_pane_left = "alt+left"
focus_pane_down = "alt+down"
focus_pane_up = "alt+up"
focus_pane_right = "alt+right"
swap_pane_left = "alt+shift+left"
swap_pane_down = "alt+shift+down"
swap_pane_up = "alt+shift+up"
swap_pane_right = "alt+shift+right"
new_tab = "ctrl+shift+t"
next_tab = ["ctrl+tab", "alt+shift+n"]
previous_tab = ["ctrl+shift+tab", "alt+shift+b"]
move_tab_previous = "alt+shift+h"
move_tab_next = "alt+shift+l"
next_workspace = "alt+shift+j"
previous_workspace = "alt+shift+k"
switch_workspace = "ctrl+1..9"
zoom = "alt+z"
toggle_sidebar = "alt+s"
goto = "alt+g"

[experimental]
kitty_graphics = true
